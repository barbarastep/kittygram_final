name: Kittygram CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend_tests:
    name: Backend — PEP8 and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_DB: kittygram_test
      POSTGRES_USER: kittygram_user
      POSTGRES_PASSWORD: ci_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SECRET_KEY: ci-only-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram_test
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kittygram_user -d kittygram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install flake8==7.3.0

      - name: Check PEP8
        run: python -m flake8 .

      - name: Run backend tests
        run: python manage.py test

  frontend_tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand
        
  build_and_push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - backend_tests
      - frontend_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: barbarastep/kittygram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: barbarastep/kittygram_frontend:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          platforms: linux/amd64
          push: true
          tags: barbarastep/kittygram_gateway:latest
