name: Kittygram CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kittygram-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend_tests:
    name: Backend — PEP8 and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_DB: kittygram_test
      POSTGRES_USER: kittygram_user
      POSTGRES_PASSWORD: ci_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SECRET_KEY: ci-only-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram_test
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kittygram_user -d kittygram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install flake8==7.3.0

      - name: Check PEP8
        run: python -m flake8 .

      - name: Run backend tests
        run: python manage.py test

  frontend_tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand

  build_and_push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - backend_tests
      - frontend_tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: barbarastep/kittygram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: barbarastep/kittygram_frontend:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          platforms: linux/amd64
          push: true
          tags: barbarastep/kittygram_gateway:latest

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build_and_push
    timeout-minutes: 15

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload Compose file
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.production.yml \
            "${SSH_USER}@${SSH_HOST}:/home/ubuntu/kittygram/docker-compose.production.yml"

      - name: Deploy Kittygram
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" <<'EOF'
          set -eu
          cd /home/ubuntu/kittygram

          kittygram_compose() {
            sudo -n docker compose -f docker-compose.production.yml "$@"
          }

          kittygram_compose config --quiet
          kittygram_compose pull
          kittygram_compose up -d --wait db

          kittygram_compose run --rm --no-deps -T --interactive=false backend \
            python manage.py migrate --noinput

          kittygram_compose run --rm --no-deps -T --interactive=false backend \
            sh -c 'python manage.py collectstatic --noinput && mkdir -p /static/backend_static && cp -r /app/collected_static/. /static/backend_static/'

          kittygram_compose up -d --force-recreate

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --retry-max-time 90 --max-time 10 \
            http://127.0.0.1:9000/admin/login/ --output /dev/null
          EOF

      - name: Check HTTPS website
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused --max-time 10 \
            https://kitty2gram.ddns.net/ --output /dev/null

          curl --fail --silent --show-error --max-time 10 \
            https://kitty2gram.ddns.net/backend_static/admin/css/base.css \
            --output /dev/null

  notify:
    name: Notify in Telegram
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Send deployment notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          curl --fail --silent --show-error --max-time 20 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=Kittygram успешно развёрнут: https://kitty2gram.ddns.net/ — commit ${GITHUB_SHA}" \
            --output /dev/null
